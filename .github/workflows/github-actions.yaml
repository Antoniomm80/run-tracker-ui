name: Build and Store Artifacts

on:
  # Run this workflow on every push or pull request to the main branch.
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    branches:
      - dev
  # Monthly rebuild so the artifact never expires (retention is 90 days).
  schedule:
    - cron: "0 6 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Specify the Node.js version you want to use

      - name: Install dependencies
        run: npm install --no-progress --force

      - name: Run npm build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtracker-app
          path: dist/ # Specify the build directory path